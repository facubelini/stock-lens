name: Historico fundamental

# Corre scripts/historico_fundamental.py (SEC EDGAR + precio de Yahoo) para
# TODO el universo de public/data/listado.json y escribe
# public/data/fundamental/<TICKER>.json + indice.json. companyfacts se cachea
# (flaco, gz) en data/edgar_cache/ y solo se re-baja cuando la empresa
# presento un reporte nuevo. Los fundamentals cambian solo
# trimestralmente, asi que no hace falta correrlo tan seguido como
# "Actualizar datos" (precio/RSI). El deploy se encadena solo, igual que ahi.

on:
  # Disparo manual.
  workflow_dispatch:

  # Semanal alcanza de sobra (los balances no cambian todas las semanas).
  schedule:
    - cron: '23 11 * * 1'   # lunes (minuto raro: los :00 son los mas demorados)

permissions:
  contents: read

# Mismo grupo que "Actualizar datos" y "Backtest Screener": los workflows de
# datos nunca se pisan entre si.
concurrency:
  group: datos-publicos
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # la primera corrida (sin cache EDGAR) baja ~350 companyfacts
    permissions:
      contents: write   # necesario para commitear el JSON generado
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      # Necesario para tener public/data/listado.json (universo) y
      # data/edgar_cache + data/cik_cache.json (para no re-bajar todo): ya no
      # viven en main, viven en la rama `datos`.
      - name: Traer datos previos (rama datos)
        run: |
          if git fetch --depth=1 origin datos; then
            git archive origin/datos | tar -x
          else
            echo "Rama 'datos' no existe todavia (primera corrida): arranca sin estado previo."
          fi

      - name: Generar JSON
        # SEC fair access: se puede declarar un User-Agent con contacto en la
        # variable de repo SEC_USER_AGENT (Settings > Variables) sin commitearlo.
        run: SEC_USER_AGENT="${{ vars.SEC_USER_AGENT }}" python scripts/historico_fundamental.py

      # Solo lo que commitea este workflow: fundamental/ (JSON estrictos + indice).
      - name: Validar datos
        id: validar
        run: python scripts/validar_datos.py public/data --solo fundamental

      - name: Commitear datos si cambiaron
        if: ${{ steps.validar.outcome == 'success' }}
        uses: ./.github/actions/commit-datos-rama
        with:
          mensaje: 'historico: actualizacion automatica'

  monitoreo:
    needs: generar
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_monitoreo-falla.yml
    with:
      workflow_nombre: 'Historico fundamental'
      resultado: ${{ needs.generar.result }}
    secrets: inherit
