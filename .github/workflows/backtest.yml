name: Backtest Screener

# Backtest de la logica del Screener (temporalidad diaria) y del Score de
# Listado contra 5 anios de historial: miden si las señales/niveles
# realmente predicen algo vs. el retorno "base" (cualquier dia). Los dos
# comparten UNA sola descarga (scripts/backtests.py). Las estadisticas no
# cambian de un dia para el otro, asi que corre mensual + disparo manual.
# El deploy se encadena solo, igual que el resto de los pipelines.

on:
  workflow_dispatch:

  schedule:
    - cron: '41 11 1 * *'   # dia 1 de cada mes (minuto raro: los :00 son los mas demorados)

permissions:
  contents: read

# Mismo grupo que "Actualizar datos" e "Historico fundamental".
concurrency:
  group: datos-publicos
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Correr backtests (Screener + Score, una sola descarga)
        run: python scripts/backtests.py

      - name: Commitear datos si cambiaron
        uses: ./.github/actions/commit-datos
        with:
          rutas: public/data/backtest_screener.json public/data/backtest_score.json
          mensaje: 'backtest: actualizacion automatica'
