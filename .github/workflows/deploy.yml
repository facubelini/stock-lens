name: Deploy a GitHub Pages

on:
  # Deploy ante cualquier push a main (codigo).
  push:
    branches: [main]

  # Deploy encadenado cuando termina un pipeline de datos.
  # Necesario porque los commits hechos con GITHUB_TOKEN NO disparan el evento
  # 'push' en otros workflows (salvaguarda anti-recursion de GitHub).
  # ("Mercado Macro" ahora es un paso de "Actualizar datos" y el Crypto
  # Screener dejo de tener workflow: se calcula en el navegador.)
  workflow_run:
    workflows: ['Actualizar datos', 'Historico fundamental', 'Backtest Screener']
    types: [completed]

  # Disparo manual.
  workflow_dispatch:

permissions:
  contents: read

# Un solo deploy a la vez. cancel-in-progress: false: cancelar un deploy a
# mitad de camino puede dejar Pages con un deploy colgado/fallido.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Si vino por workflow_run de un pipeline de datos, solo deployar si esa
  # corrida realmente empujo algo nuevo a la rama `datos`. Desde la migracion
  # a la rama huerfana (ver README, "Rama de datos"), esos workflows YA NO
  # avanzan `main` (commitean a `datos`, que se pushea SIEMPRE con --force
  # como un commit fresco sin padre): comparar el sha de main como antes
  # siempre daria "no cambio nada". En cambio se compara la FECHA del commit
  # actual de `datos` contra el inicio de la corrida que disparo este deploy:
  # si es posterior, esa corrida sí empujo (el commit es mas nuevo que su
  # propio arranque); si es anterior, el commit-datos-rama de esa corrida
  # comparo arboles y no hizo push (nada cambio) y no hace falta deployar.
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      desplegar: ${{ steps.chequeo.outputs.desplegar }}
    steps:
      - name: ¿Hay algo nuevo para deployar?
        id: chequeo
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          INICIO_CORRIDA: ${{ github.event.workflow_run.run_started_at }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENTO" != "workflow_run" ]; then
            echo "desplegar=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$CONCLUSION" = "cancelled" ] || [ "$CONCLUSION" = "skipped" ] || [ "$CONCLUSION" = "failure" ]; then
            echo "Corrida $CONCLUSION: no se deploya."
            echo "desplegar=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          fecha_datos=$(gh api "repos/${GITHUB_REPOSITORY}/commits/datos" --jq .commit.committer.date 2>/dev/null || echo "")
          if [ -z "$fecha_datos" ]; then
            echo "La rama 'datos' todavia no existe: no se deploya (falta migrar, ver README)."
            echo "desplegar=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$fecha_datos" > "$INICIO_CORRIDA" ]]; then
            echo "datos avanzo (commit $fecha_datos es posterior al arranque $INICIO_CORRIDA de la corrida): se deploya."
            echo "desplegar=true" >> "$GITHUB_OUTPUT"
          else
            echo "La corrida no empujo nada nuevo a 'datos' (commit $fecha_datos <= arranque $INICIO_CORRIDA): no se deploya."
            echo "desplegar=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: verificar
    if: ${{ needs.verificar.outputs.desplegar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Solo public/data: es lo unico que sirve el frontend (data/ es estado
      # interno del pipeline, no lo usa el build).
      - name: Traer datos publicados (rama datos)
        run: |
          git fetch --depth=1 origin datos
          git archive origin/datos public/data | tar -x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  monitoreo:
    needs: [verificar, build, deploy]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/_monitoreo-falla.yml
    with:
      workflow_nombre: 'Deploy a GitHub Pages'
      # Si no tocaba deployar (desplegar == 'false'), verificar/build/deploy
      # terminan "skipped": eso no es una falla, se trata como éxito.
      resultado: ${{ (contains(needs.*.result, 'failure') && 'failure') || 'success' }}
    secrets: inherit
