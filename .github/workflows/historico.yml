name: Historico fundamental

# Corre el script de SEC EDGAR (P/E, EV/Sales, P/S "LTM") para los tickers de
# data/historico_tickers.json (maximo 20, ver LIMITE_TICKERS en
# scripts/historico_fundamental.py). Los fundamentals cambian solo
# trimestralmente, asi que no hace falta correrlo tan seguido como
# "Actualizar datos" (precio/RSI). El deploy se encadena solo, igual que ahi.

on:
  # Disparo manual (tambien lo dispara la app cuando agregas/sacas un ticker
  # de esta lista via la API de GitHub).
  workflow_dispatch:

  # Semanal alcanza de sobra (los balances no cambian todas las semanas).
  schedule:
    - cron: '23 11 * * 1'   # lunes (minuto raro: los :00 son los mas demorados)

permissions:
  contents: read

# Mismo grupo que "Actualizar datos" y "Backtest Screener": los workflows de
# datos nunca se pisan entre si.
concurrency:
  group: datos-publicos
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # necesario para commitear el JSON generado
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Generar JSON
        run: python scripts/historico_fundamental.py

      - name: Commitear datos si cambiaron
        uses: ./.github/actions/commit-datos
        with:
          rutas: public/data/historico_fundamental.json data/cik_cache.json
          mensaje: 'historico: actualizacion automatica'
