name: Actualizar datos

# Corre el pipeline de Python (yfinance) + los indicadores de mercado/macro
# (antes era un workflow aparte, "Mercado Macro": ahora es un paso mas, asi
# cada corrida hace UN solo commit y UN solo deploy) y commitea los JSON.
# El deploy se encadena solo: ver deploy.yml (trigger workflow_run).

on:
  # Disparo manual desde la pestania Actions.
  workflow_dispatch:

  # Programado (GitHub Actions usa horario UTC). Mercado USA 9:30-16:00 ET
  # => 13:30-20:00 UTC (EDT) / 14:30-21:00 UTC (EST).
  # OJO 1: GitHub arranca los crons con MUCHO atraso (medido: 2.5-4.6 h), y
  # los minutos "redondos" (:00/:30) son los mas demorados. Por eso minutos
  # raros y horarios corridos hacia atras: con atraso cero o maximo, cada
  # corrida sigue cayendo en una sesion util.
  # OJO 2: preMarketPrice/postMarketPrice solo se capturan si la corrida cae
  # en esa sesion (marketState PRE / POST-POSTPOST); el pipeline conserva el
  # ultimo valor capturado con su timestamp, no lo pisa con null.
  # Con cientos de tickers cada corrida hace muchas llamadas a Yahoo; mas
  # corridas aumentan el riesgo de rate-limit. Repo publico = minutos de
  # Actions ilimitados.
  schedule:
    - cron: '17 9 * * 1-5'   # pre-market (sin atraso 05:17 ET; con 2.5-4.6 h, 07:47-09:53 ET)
    - cron: '43 12 * * 1-5'  # ~apertura
    - cron: '13 15 * * 1-5'  # ~mediodia
    - cron: '37 17 * * 1-5'  # ~cierre
    - cron: '47 20 * * 1-5'  # post-market (sin atraso 16:47 ET; con atraso cae en POST/POSTPOST)

permissions:
  contents: read

# Un solo grupo para TODOS los workflows que commitean a public/data o data/
# (datos, historico, backtest): nunca corren dos a la vez, asi no hay
# carreras de push entre ellos. cancel-in-progress: false = la corrida en
# curso termina; GitHub deja como maximo una en espera (si llega otra, la
# pendiente mas vieja se descarta, no la que esta corriendo).
concurrency:
  group: datos-publicos
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # necesario para commitear los JSON generados
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Traer datos previos (rama datos)
        run: |
          if git fetch --depth=1 origin datos; then
            git archive origin/datos | tar -x
          else
            echo "Rama 'datos' no existe todavia (primera corrida): arranca sin estado previo."
          fi

      - name: Generar JSON (acciones)
        id: acciones
        run: python scripts/generar_datos.py

      # No depende de la lista de tickers: si el paso anterior aborto (rate
      # limit), igual se actualiza el macro. Un fallo aca no bloquea el commit.
      - name: Mercado macro
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python scripts/mercado_macro.py

      # Contrato de datos (forma, rangos, archivos por ticker, n_frescos vs.
      # el meta.json de HEAD): si algo no cumple, NO se commitea nada. Corre
      # aunque el paso de acciones haya abortado (ahi valida los datos
      # anteriores + el macro nuevo, que si se commitean).
      - name: Validar datos
        id: validar
        if: ${{ !cancelled() }}
        run: python scripts/validar_datos.py public/data

      - name: Commitear datos si cambiaron
        id: commit
        if: ${{ !cancelled() && steps.validar.outcome == 'success' }}
        uses: ./.github/actions/commit-datos-rama
        with:
          mensaje: 'datos: actualizacion automatica'

      # Alertas por Telegram (VCP, Warren Score, EMA200/RSI semanal, watchlist).
      # Si faltan los secrets no hace nada (exit 0): no requiere que esten
      # configurados para que el resto del workflow siga funcionando.
      - name: Alertas
        if: ${{ !cancelled() && steps.validar.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/alertas.py

      # El estado de alertas (data/alertas_estado.json) cambio en disco pero
      # todavia no esta en la rama datos (el commit de arriba se armo ANTES
      # de correr las alertas): un segundo commit chiquito lo agrega. Sin
      # esto, la proxima corrida repetiria los mismos eventos.
      - name: Commitear estado de alertas si cambio
        if: ${{ !cancelled() && steps.validar.outcome == 'success' }}
        uses: ./.github/actions/commit-datos-rama
        with:
          mensaje: 'datos: estado de alertas'

  monitoreo:
    needs: generar
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/_monitoreo-falla.yml
    with:
      workflow_nombre: 'Actualizar datos'
      resultado: ${{ needs.generar.result }}
    secrets: inherit
