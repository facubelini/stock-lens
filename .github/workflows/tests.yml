name: Tests

# Tests del pipeline de Python (unitarios + golden byte a byte del pipeline
# completo con la red grabada, ver tests/golden/grabacion.py) y del frontend
# (vitest + build). Solo corre si se toca codigo: los commits automaticos de
# datos (public/data, data/) no lo disparan.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pytest.ini'
      - 'vite.config.js'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pytest.ini'
      - 'vite.config.js'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements-dev.txt

      - name: pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: vitest
        run: npm test

      - name: Build
        run: npm run build
